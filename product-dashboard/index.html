<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Product Dashboard</title>
    <link rel="stylesheet" href="css/login.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">&#x1F6D2;</div>
            <h2>Product Dashboard</h2>
            <p class="login-subtitle">Sign in to manage your products</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">&#x1F441;</button>
                    </div>
                </div>
                <button type="submit" class="login-btn">Login</button>
                <p class="error-msg"></p>
            </form>

            <p class="demo-hint">Demo credentials: <strong>admin</strong> / <strong>admin</strong></p>
        </div>
    </div>
</body>
</html>
