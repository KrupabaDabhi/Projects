<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Product Management</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js" defer></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Product Management</h2>
            <ul>
                <li><a href="#" class="active">Dashboard</a></li>
                <li><a href="#" id="addProductBtn">Add Product</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header>
                <div class="header-left">
                    <h1>Dashboard</h1>
                    <span class="product-count" id="productCount">Products (0)</span>
                </div>
                <input type="text" id="search" placeholder="Search products...">
            </header>

            <section class="products-grid" id="productsGrid">
                <!-- Products loaded here -->
            </section>
        </main>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <span class="close" aria-label="Close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal" id="addProductModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
        <div class="modal-content">
            <span class="close" aria-label="Close">&times;</span>
            <h2 id="addModalTitle">Add New Product</h2>

            <form id="addProductForm" novalidate>
                <div class="form-group">
                    <label for="fieldTitle">Title</label>
                    <input type="text" id="fieldTitle" name="title" placeholder="e.g. Wireless Headphones" required>
                </div>

                <div class="form-group">
                    <label for="fieldPrice">Price ($)</label>
                    <input type="number" id="fieldPrice" name="price" placeholder="e.g. 29.99" min="0" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="fieldCategory">Category</label>
                    <input type="text" id="fieldCategory" name="category" placeholder="e.g. electronics" required>
                </div>

                <div class="form-group">
                    <label for="fieldImage">Image URL</label>
                    <input type="text" id="fieldImage" name="image" placeholder="https://..." required>
                </div>

                <div class="form-group">
                    <label for="fieldDescription">Description</label>
                    <textarea id="fieldDescription" name="description" placeholder="Short product description..." required></textarea>
                </div>

                <button type="submit">Add Product</button>
            </form>

            <p class="form-msg"></p>
        </div>
    </div>
</body>
</html>
