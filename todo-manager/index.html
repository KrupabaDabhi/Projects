<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- App Wrapper -->
    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="header-accent"></div>
            <h1>&#128197; Task Manager</h1>
            <p class="task-count-summary" id="taskCountSummary">0 tasks remaining</p>
        </header>

        <!-- Task Input Section -->
        <section class="task-input-section">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                    maxlength="100"
                />
                <span class="char-counter" id="charCounter">0/100</span>
            </div>
            <button id="addTaskBtn">&#43; Add Task</button>
        </section>

        <!-- Filters -->
        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">All <span class="filter-count" id="count-all">0</span></button>
            <button class="filter-btn" data-filter="active">Active <span class="filter-count" id="count-active">0</span></button>
            <button class="filter-btn" data-filter="completed">Completed <span class="filter-count" id="count-completed">0</span></button>
        </section>

        <!-- Task List -->
        <ul id="taskList" class="task-list">
            <!-- Tasks will be injected here dynamically -->
        </ul>

    </div>

    <!-- JavaScript Files — load order: storage, tasks, filters, dragdrop, app -->
    <script src="js/storage.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/dragdrop.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
