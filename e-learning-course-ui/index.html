<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Learning Courses</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header>
        <h1>E-Learning Courses</h1>
        <input type="text" id="search" placeholder="Search courses...">
        <select id="categoryFilter">
            <option value="all">All Categories</option>
        </select>
    </header>

    <main>
        <div id="courseContainer" class="course-container">
            <!-- Course cards will be dynamically added here -->
        </div>
    </main>

    <!-- Modal -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="Course Image">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            <p><strong>Price:</strong> $<span id="modalPrice"></span></p>
            
            <h3>Enroll in this course</h3>
            <form id="enrollForm">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <input type="text" name="course" id="courseName" readonly>
                <button type="submit">Enroll</button>
            </form>
            <p id="enrollMessage" class="success-msg"></p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
